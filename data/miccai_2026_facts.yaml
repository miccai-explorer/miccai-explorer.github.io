# MICCAI 2026 talk counts, entered by hand from the program booklet
# (data/manually_downloaded/OralSchedules/2026.pdf).
#
# Read only by analysis/extract_program_2026.py and tests/test_program_2026.py.
# The booklet parser treats a disagreement between these and what it parses out
# of the session pages as a hard error rather than a warning: a silently
# dropped talk would bias every presentation-type number on the Orals page with
# nothing on the page looking wrong.
#
# This file used to carry the whole 2026 stat strip (submissions, accepted
# count, early-accept share) while 2026 was published from the booklet alone.
# Those now come from the scraped data and num_papers_submitted.yaml like every
# other year.

year: 2026
n_orals: 99
n_spotlights: 54
