# Principal colours sampled from each year's MICCAI conference logo.
#
# THIS FILE IS A PROVENANCE RECORD, NOT AN INPUT. No code reads it. Editing a
# value here changes nothing on the site.
#
# The colours actually used are hardcoded in two places, and both must be
# edited by hand to match:
#   analysis/build_charts.py  YEAR_PALETTES   {"main": ..., "secondary": ...}
#   analysis/build_site.py    YEAR_META_RAW   "color" / "color2"
#
# They cannot simply be generated from this file, because picking WHICH two of
# the three primaries to use, and which is main rather than secondary, is a
# judgement call: 2022 skips #231f20 (near-black, second in its list) in favour
# of the red, and 2023 promotes the green over the red that leads its list.
# Closing that gap means adding explicit main/secondary keys here and having
# both scripts read them; see REPRODUCIBILITY.md gap G3.
#
# Verified 2026-08-30: all three copies agree.
#
# "additional_avoid_if_possible" are further colours present in the logo that
# read poorly as chart accents (too dark, too pale, or too close to a primary).

2026:
  primary:
    - "#293587"
    - "#00adf0"
    - "#2596be"
  additional_avoid_if_possible:
    - "#959cc7"
    - "#80d4f0"
    - "#949dc7"
    - "#1471b8"


